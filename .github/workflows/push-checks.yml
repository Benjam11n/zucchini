name: Push Checks

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    name: Fallow Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dead code
        uses: fallow-rs/fallow@d052786ef2baf78fa5b196f06dbccd6f0d26798e
        with:
          command: dead-code
          format: sarif
          production: true
          comment: true
          annotations: true
          max-annotations: 50

      - name: Check duplication
        uses: fallow-rs/fallow@d052786ef2baf78fa5b196f06dbccd6f0d26798e
        with:
          command: dupes
          format: json
          production: true
          comment: true
          annotations: true
          max-annotations: 50

  desktop-checks:
    name: Desktop Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm --dir apps/desktop exec node node_modules/electron/install.js

      - name: Audit dependencies
        run: pnpm --dir apps/desktop audit:ci

      - name: Lint repository
        run: pnpm run lint

      - name: Typecheck desktop app
        run: pnpm --dir apps/desktop typecheck

      - name: Run desktop tests
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
        run: pnpm run test:desktop

  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm --dir apps/web audit:ci

      - name: Build web app
        run: pnpm run build:web
