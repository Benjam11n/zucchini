name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: release-build-windows
          - os: macos-14
            artifact_name: release-build-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm --dir apps/desktop exec node node_modules/electron/install.js

      - name: Audit dependencies
        run: pnpm --dir apps/desktop audit:ci

      - name: Run tests
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
        run: pnpm --dir apps/desktop test

      - name: Rebuild native desktop dependencies
        run: pnpm --dir apps/desktop rebuild:native

      - name: Build app bundles
        run: pnpm --dir apps/desktop build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  prepare-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Generate release notes
        run: pnpm --dir apps/desktop exec node scripts/generate-changelog.mjs --tag "$RELEASE_TAG" --output ../../release-notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "Zucchini ${RELEASE_TAG#v}" \
              --notes-file release-notes.md

          gh release edit "$RELEASE_TAG" \
            --draft \
            --title "Zucchini ${RELEASE_TAG#v}" \
            --notes-file release-notes.md

  release:
    needs:
      - build
      - prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: release-build-windows
            release_script: dist:release:win
          - os: macos-14
            artifact_name: release-build-macos
            release_script: dist:release:mac

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_RELEASE_OWNER: ${{ github.repository_owner }}
      GH_RELEASE_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native desktop dependencies
        run: pnpm --dir apps/desktop rebuild:native

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop

      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir apps/desktop ${{ matrix.release_script }}
